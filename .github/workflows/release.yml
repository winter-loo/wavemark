name: release

# Builds release binaries for every supported platform and attaches them to a
# GitHub release.
#
# Two triggers:
#   - push a `v*` tag    -> normal release
#   - workflow_dispatch  -> rebuild an existing tag without moving it
#
# A tag containing a hyphen (`v0.1.0-rc.1`) is published as a pre-release;
# anything else (`v0.1.0`) is a full release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The Windows runner's default shell is PowerShell, which does not understand
# `\` line continuations and treats `-p` as an unknown cmdlet. Forcing bash
# everywhere keeps every step below portable across the whole matrix.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # One platform failing shouldn't cancel the others — a broken Windows build
    # is no reason to withhold the macOS binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      # gpui-kit links against these directly. The list below is the one that
      # actually links `wavemark-ui` on ubuntu-22.04 — `libxkbcommon-x11-dev`,
      # `libfontconfig1-dev` and `libfreetype6-dev` are all required at *link*
      # time, not just build time, so omitting any of them fails in the final
      # step rather than during compilation.
      - name: Install Linux display/system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-dev libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
            libwayland-dev libxkbfile-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev libasound2-dev pkg-config cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p wavemark-cli -p wavemark-ui

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="wavemark-$tag-${{ matrix.target }}"
          mkdir -p "staging/$name"
          for b in wavemark wavemark-ui; do
            cp "target/${{ matrix.target }}/release/$b" "staging/$name/"
          done
          cp README.md LICENSE "staging/$name/"
          tar -czf "$name.tar.gz" -C staging "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="wavemark-$tag-${{ matrix.target }}"
          mkdir -p "staging/$name"
          for b in wavemark wavemark-ui; do
            cp "target/${{ matrix.target }}/release/$b.exe" "staging/$name/"
          done
          cp README.md LICENSE "staging/$name/"
          (cd staging && 7z a "../$name.zip" "$name")
          echo "$(sha256sum "$name.zip" | cut -d' ' -f1)  $name.zip" > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  # GitHub retired the x86_64 macOS runners (`macos-13` and older), so Intel
  # Mac binaries are cross-compiled from an Apple Silicon runner instead. The
  # macOS SDK shipped with Xcode is universal, so linking for `-arch x86_64`
  # works without a second machine.
  #
  # Best effort: Intel Macs are a shrinking slice of users and this is the one
  # target we cannot verify end-to-end, so a failure here must not block the
  # release for everyone else.
  build-macos-intel:
    name: x86_64-apple-darwin (cross)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin-cross

      - name: Build
        run: |
          cargo build --release --locked --target x86_64-apple-darwin \
            -p wavemark-cli -p wavemark-ui

      - name: Package
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="wavemark-$tag-x86_64-apple-darwin"
          mkdir -p "staging/$name"
          for b in wavemark wavemark-ui; do
            cp "target/x86_64-apple-darwin/release/$b" "staging/$name/"
          done
          cp README.md LICENSE "staging/$name/"
          tar -czf "$name.tar.gz" -C staging "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64-apple-darwin
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  # Smoke-test the binaries on the machine that built them before publishing.
  # Catches "it compiled but immediately segfaults" — cheap insurance.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist

      # Ubuntu ships `python3` while the Windows image only exposes `python`;
      # resolve it once rather than guessing per step.
      - name: Resolve python
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "PYTHON_BIN=python3" >> "$GITHUB_ENV"
          elif command -v python >/dev/null 2>&1; then
            echo "PYTHON_BIN=python" >> "$GITHUB_ENV"
          else
            echo "::error::no python interpreter found"
            exit 1
          fi

      # Export the absolute path of the binary instead of putting its directory
      # on PATH: a glob inside double quotes is not expanded, and Git Bash's
      # POSIX-style `$PWD` is not a valid Windows PATH entry.
      - name: Unpack (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd dist
          tar -xzf ./*.tar.gz
          bindir="$(ls -d "$PWD"/wavemark-*"${{ matrix.target }}")"
          echo "WM=$bindir/wavemark" >> "$GITHUB_ENV"
          chmod +x "$bindir/wavemark"

      - name: Unpack (windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          cd dist
          7z x ./*.zip
          bindir="$(ls -d "$PWD"/wavemark-*"${{ matrix.target }}")"
          echo "WM=$bindir/wavemark.exe" >> "$GITHUB_ENV"

      - name: wavemark --version
        run: '"$WM" --version'

      - name: Round-trip a generated file
        run: |
          set -euo pipefail
          # A 1s tone, 1s silence, 1s tone — enough to exercise decode,
          # silence detection, annotation writing and export.
          "$PYTHON_BIN" - <<'PYEOF'
          import math, struct, wave
          sr = 44100
          tone = lambda f: [0.6*math.sin(2*math.pi*f*i/sr) for i in range(sr)]
          s = tone(440) + [0.0]*sr + tone(660)
          w = wave.open('clip.wav','w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h', int(max(-1,min(1,x))*32767)) for x in s)); w.close()
          PYEOF
          "$WM" -f clip.wav info
          "$WM" -f clip.wav silence --sound --write
          "$WM" -f clip.wav annotations --format json > notes.json
          test "$("$PYTHON_BIN" -c 'import json;print(len(json.load(open("notes.json"))["annotations"]))')" = "2"
          "$WM" -f clip.wav batch-export -o out >/dev/null
          test -f out/manifest.json
          echo "smoke test passed"

  release:
    name: publish
    needs: [build, build-macos-intel, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Collect checksums
        run: |
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Is this a pre-release?
        id: kind
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "title=$tag (pre-release)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.kind.outputs.title }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*
