name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-and-cli:
    name: build + test core & cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p wavemark-core -p wavemark-cli --verbose

      - name: Test
        run: cargo test -p wavemark-core --verbose

      - name: Clippy
        run: cargo clippy -p wavemark-core -p wavemark-cli --all-features -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check
